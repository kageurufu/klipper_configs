    FAN0=PA0, FAN1=PA1, FAN2=PA2, FAN3=PA3, FAN4=PA4, FAN4=PA5, FAN6=PA6, FAN6_TACH=PC1, FAN7=PE8, FAN7_TACH=PG0,
    
