    EXP2_1=<GND>, EXP2_3=PG6,   EXP2_5=PG7,  EXP2_7=PG8,  EXP2_9=PE13,
    EXP2_2=<NC>,  EXP2_4=<RST>, EXP2_6=PE14, EXP2_8=PE11, EXP2_10=PE12,
    