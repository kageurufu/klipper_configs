    S7_DIR=PB3,  S7_STEP=PB4,  S7_EN=PB5,  S7_CS=PA9,   S7_STOP=PF10,
    S8_DIR=PB6,  S8_STEP=PG15, S8_EN=PA9,  S8_CS=PA10,  S8_STOP=PC0,
    
