[gcode_macro PUSH_NOTIFICATION]
gcode:
  {% if 'BODY' not in params %}
    {action_raise_error('PUSH_NOTIFICATION BODY="message"')}
  {% endif %}

  {% if params.TITLE is defined %} 
    {action_respond_info("MR_NOTIFY:{}|{}".format(params.TITLE, params.BODY))}
  {% else %}
    {action_respond_info("MR_NOTIFY:{}".format(params.BODY))}
  {% endif %}
